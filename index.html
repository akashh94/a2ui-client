<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>A2UI Demo Client</title>
  <!-- Tokens + component styles are shared with catalog.html. -->
  <link rel="stylesheet" href="a2ui.css" />
  <style>
    body { font-family: Roboto, system-ui, sans-serif; margin: 0; background: var(--bg); }
    header { background: #fff; border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; align-items: center; gap: 12px; }
    header h1 { font-size: 18px; margin: 0; flex: 1; }
    .status { font-size: 12px; color: #5f6368; }
    main { max-width: 860px; margin: 20px auto; padding: 0 20px; }
    .panel { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
    .panel h2 { font-size: 14px; margin: 0 0 12px; color: #202124; text-transform: uppercase; letter-spacing: 0.5px; }
    #chatLog { height: min(72vh, 640px); overflow-y: auto; font-size: 13px; }
    .msg { margin: 6px 0; padding: 6px 8px; border-radius: 6px; white-space: pre-wrap; }
    .msg.user { background: #e8f0fe; }
    .msg.agent { background: #f1f3f4; }
    .msg.event { background: #fef7e0; font-family: monospace; font-size: 11px; }
    input, button { font: inherit; }
    .inputRow { display: flex; gap: 8px; margin-top: 8px; }
    .inputRow input { flex: 1; padding: 8px; border: 1px solid var(--border); border-radius: 6px; }
    .inputRow button, .btn { padding: 8px 14px; border: 0; border-radius: 6px; background: var(--brand); color: #fff; cursor: pointer; }
    a.btn { text-decoration: none; display: inline-block; }
    /* Chat-specific: separate consecutive surfaces in the timeline. */
    #chatLog .a2ui-surface { margin: 8px 0; }
  </style>
</head>
<body>
  <header>
    <h1>A2UI Demo Client</h1>
    <span class="status" id="status">connecting…</span>
    <a class="btn" href="catalog.html">Catalog →</a>
  </header>
  <main>
    <section class="panel">
      <h2>Chat</h2>
      <div id="chatLog"></div>
      <div class="inputRow">
        <input id="prompt" placeholder='e.g. "show me an A2UI demo with a button and text"' />
        <button id="send">Send</button>
      </div>
      <div style="margin-top:8px; display:flex; gap:8px;">
        <button class="btn" id="demoA2UI">A2UI demo</button>
        <button class="btn" id="demoText">Text question</button>
      </div>
    </section>
  </main>

  <script src="agent_url.js"></script>
  <script>
    // Optional: /?agent=https://<agent-url> overrides the URL injected at deploy
    // time (agent_url.js). This must run AFTER agent_url.js, which assigns
    // unconditionally — loading it first meant the query param was clobbered.
    const agentParam = new URLSearchParams(location.search).get("agent");
    if (agentParam) window.A2UI_AGENT_URL = agentParam;
  </script>
  <script src="a2ui-render.js"></script>
  <script src="client.js"></script>
</body>
</html>
